name: SaaS isolation tests (Phase 1)

# Runs the multi-tenant foundation tests, including the RLS isolation suite, against a
# disposable PostgreSQL service container.

on:
  push:
    branches:
      - main
    paths:
      - "db/**"
      - "saas/**"
      - "tests/test_saas_*.py"
      - "tests/saas_test_support.py"
      - "requirements.txt"
      - ".github/workflows/saas-isolation.yml"
  pull_request:
    paths:
      - "db/**"
      - "saas/**"
      - "tests/test_saas_*.py"
      - "tests/saas_test_support.py"
      - "requirements.txt"
      - ".github/workflows/saas-isolation.yml"
  workflow_dispatch:

jobs:
  isolation-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SAAS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_phase1_test
      SAAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_phase1_test
      SAAS_REQUIRE_TEST_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SaaS/dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require SaaS test database
        run: test -n "$SAAS_TEST_DATABASE_URL"

      - name: Apply migrations, local roles and seed data
        # --include-local applies db/local/*.sql, which grants app_backend a LOGIN so the
        # tests can connect as the real application role. It is never applied on Supabase.
        run: python db/run_migrations.py --include-local --seed

      - name: Show migration status
        run: python db/run_migrations.py --status

      - name: Run the Phase 1 isolation and structural tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_saas_*.py" -v 2>&1 | tee /tmp/saas-tests.log
          grep -Eq '^Ran [1-9][0-9]* tests?' /tmp/saas-tests.log
          if grep -Eq 'skipped=[1-9][0-9]*' /tmp/saas-tests.log; then
            echo "SaaS isolation tests must not be skipped in CI" >&2
            exit 1
          fi

      - name: Run the complete repository test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v