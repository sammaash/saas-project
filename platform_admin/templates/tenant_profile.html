{% extends "base.html" %}
{% block content %}
{% from "_macros.html" import csrf_field, tenant_tabs %}
{{ tenant_tabs(tenant, tab) }}
<h2>Business profile</h2>
<form method="post" class="card narrow">
  {{ csrf_field() }}
  <label>Business name <input name="name" value="{{ profile.tenant.name }}" required maxlength="200"></label>
  <label>Activity <input name="activity" value="{{ profile.settings.configuration.get('activity', '') }}" maxlength="200"
                        placeholder="e.g. Auto parts retail, salon, electronics shop"></label>
  <button type="submit">Save profile</button>
</form>
{% endblock %}
