{% extends "base.html" %}
{% block content %}
{% from "_macros.html" import csrf_field %}
<h1>Create tenant</h1>
<p class="muted">The tenant is created as a draft. Configure it, add its catalogue, then activate it.</p>
<form method="post" class="card narrow">
  {{ csrf_field() }}
  <label>Business name <input name="name" value="{{ form.get('name', '') }}" required maxlength="200"></label>
  <label>Slug <input name="slug" value="{{ form.get('slug', '') }}" required pattern="[a-z0-9][a-z0-9-]{2,39}"></label>
  <label>Timezone <input name="timezone" value="{{ form.get('timezone', 'Africa/Nairobi') }}" required></label>
  <label>Currency <input name="currency" value="{{ form.get('currency', 'KES') }}" required maxlength="3"></label>
  <label>Owner user id (verified Auth UUID, optional)
    <input name="owner_user_id" value="{{ form.get('owner_user_id', '') }}" placeholder="leave blank to assign later"></label>
  <label>Plan (optional)
    <select name="plan_id">
      <option value="">None</option>
      {% for plan in plans %}<option value="{{ plan.id }}">{{ plan.name }}</option>{% endfor %}
    </select></label>
  <button type="submit">Create draft tenant</button>
</form>
{% endblock %}
